# ── PAGE 3: Moving Heads X/Y ──────────────────────────────────────────────────
[[pages]]
name = "MovingHeads"
selector_color = 79
xy_mode = true

  [pages.xy_config]
  pan_address    = "/qlc/channel/1"
  tilt_address   = "/qlc/channel/2"
  color_inactive = 45# blue
  color_active   = 72# white
[[pages]]
name = "MovingHeadsFine"
selector_color = 53
xy_mode = true

  [pages.xy_config]
  pan_address    = "/qlc/channel/3"
  tilt_address   = "/qlc/channel/4"
  color_inactive = 53 # purple
  color_active   = 72# white
# ── PAGE 4: Dimmer Sliders ────────────────────────────────────────────────────
[[pages]]
name = "Dimmers"
selector_color = 96
fader_mode = true

  [pages.fader_config]
  addresses = [
    "/qlc/channel/10",
    "/qlc/channel/11",
    "/qlc/channel/12",
    "/qlc/channel/13",
    "/qlc/channel/14",
    "/qlc/channel/15",
    "/qlc/channel/16",
    "/qlc/channel/17",
  ]
  color_on  = 13
  color_off = 0