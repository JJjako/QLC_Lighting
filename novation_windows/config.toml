  label = "Scene: Warm"
  color = 96
  osc_address = "/qlc/function/10"
  osc_value = 1.0

  [[pages.buttons]]
  note = 82
  label = "Scene: Cool"
  color = 57
  osc_address = "/qlc/function/11"
  osc_value = 1.0

  [[pages.buttons]]
  note = 83
  label = "Scene: Red"
  color = 5
  osc_address = "/qlc/function/12"
  osc_value = 1.0

  [[pages.buttons]]
  note = 84
  label = "Scene: Blue"
  color = 45
  osc_address = "/qlc/function/13"
  osc_value = 1.0

  [[pages.buttons]]
  note = 85
  label = "Scene: Green"
  color = 21
  osc_address = "/qlc/function/14"
  osc_value = 1.0

  [[pages.buttons]]
  note = 86
  label = "Scene: Purple"
  color = 53
  osc_address = "/qlc/function/15"
