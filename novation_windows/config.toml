selector_color = 21

  [[pages.buttons]]
  note = 81
  label = "Strobe Fast"
  color = 72
  osc_address = "/qlc/function/1"
  osc_value = 1.0

  [[pages.buttons]]
  note = 82
  label = "Strobe Slow"
  color = 72
  osc_address = "/qlc/function/2"
  osc_value = 1.0

  [[pages.buttons]]
  note = 83
  label = "Color Chase"
  color = 13
  osc_address = "/qlc/function/3"
  osc_value = 1.0

  [[pages.buttons]]
  note = 84
  label = "Rainbow"
  color = 53
  osc_address = "/qlc/function/4"
  osc_value = 1.0

  [[pages.buttons]]
  note = 71
  label = "Blackout"
  color = 5
  osc_address = "/qlc/function/99"
  osc_value = 1.0

  [[pages.buttons]]
  note = 72
  label = "Full ON"
  color = 72
  osc_address = "/qlc/function/100"
  osc_value = 1.0

# ── PAGE 2: Static Scenes ─────────────────────────────────────────────────────
[[pages]]
name = "Scenes"
