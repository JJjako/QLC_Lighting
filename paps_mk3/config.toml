# ─────────────────────────────────────────────────────────────────────────────
# Launchpad Mini MK3 → QLC+ OSC Bridge  —  config.toml
#
# Fixture universe layout (from your workspace):
#   Fixture 0  → Moving Head 1  (monitor)      DMX  1–14   (universe 0, addr 0)
#   Fixture 1  → Moving Head 2  (komp)         DMX 15–28   (universe 0, addr 14)
#   Fixture 2  → Moving Head 3  (drummer)      DMX 29–42   (universe 0, addr 28)
#   Fixture 3  → Moving Head 4  (komplementär) DMX 43–56   (universe 0, addr 42)
#   Fixture 4  → SePar RGBW    (moni)          DMX 57–60   (universe 0, addr 56)
#   Fixture 5  → SePar RGBW    (main)          DMX 61–64   (universe 0, addr 60)
#   Fixture 6  → SePar RGBW    (komple)        DMX 65–68   (universe 0, addr 64)
#   Fixture 7  → Generic 6ch dimmer (halogens) DMX 69–74   (universe 0, addr 68)
#
# OSC address scheme used throughout:
#   /qlc/function/<id>       → start/stop a QLC+ Function by ID
#   /qlc/channel/<universe>/<address>   → set a raw DMX channel (0-based)
#
# Moving Head 14-ch layout (per fixture):
#   ch 0 = Pan      ch 1 = Pan Fine    ch 2 = Tilt     ch 3 = Tilt Fine
#   ch 4 = Speed    ch 5 = Dimmer      ch 6 = Strobe    ch 7 = Red
#   ch 8 = Green    ch 9 = Blue       ch 10 = White    ch 11 = Color Macro
#   ch 12 = Programs ch 13 = Reset
#
# SePar RGBW 4-ch layout:
#   ch 0 = Red   ch 1 = Green   ch 2 = Blue   ch 3 = White
#
# Generic 6ch dimmer:
#   ch 0–5 = Dimmer channels (halogens 1–6)
#
# Palette colour reference (Launchpad MK3):
#   0=off  5=dimRed  13=yellow  21=dimGreen  45=blue
#   53=purple  57=cyan  72=white  79=pink  96=orange
# ─────────────────────────────────────────────────────────────────────────────

[osc]
host = "127.0.0.1"
port = 7700

[midi]
device_name     = "MIDIIN2 (LPMiniMK3 MIDI)"
device_out_name = "LPMiniMK3 MIDI"

# ─────────────────────────────────────────────────────────────────────────────
