# ─────────────────────────────────────────────────────────────────────────────
# PAGE 3 [CC 94] — BEAT SYNC
# Background thread fires colour changes on every beat.
# Right column: [59]=tap tempo  [49]=next palette  [39]=prev palette
# Grid: static visual (bottom row lit as ready indicator).
# ─────────────────────────────────────────────────────────────────────────────
[[pages]]
name           = "Beat"
selector_color = 13     # yellow
beat_mode      = true

  [pages.beat_config]
  # OSC addresses to cycle through — one per beat step.
  # These should point to QLC+ scenes that set a specific colour on the RGBWs.
  rgb_addresses = [
    "/qlc/function/30",   # Red
    "/qlc/function/31",   # Green
    "/qlc/function/32",   # Blue
    "/qlc/function/34",   # Purple
    "/qlc/function/36",   # Cyan
    "/qlc/function/35",   # Yellow
    "/qlc/function/33",   # White
    "/qlc/function/37",   # Off
  ]
  default_bpm = 120.0

  # Palette entries are QLC+ palette colour indices (0-127) used for
  # the Launchpad LED visualisation of each beat step.
  palettes = [
    # Palette 0: Rainbow chase
    [5, 21, 45, 53, 57, 13, 72, 0],
    # Palette 1: Red/Blue strobe
    [5, 0, 45, 0, 5, 0, 45, 0],
    # Palette 2: White flash
    [72, 0, 72, 0, 72, 0, 72, 0],
    # Palette 3: Warm
    [96, 13, 5, 13, 96, 13, 5, 0],
  ]


# ─────────────────────────────────────────────────────────────────────────────
# PAGE 4 [CC 95] — XY PAN/TILT
# Tap a grid cell to set pan+tilt for all 4 moving heads simultaneously.
# Right column:
#   [89] = toggle Coarse (green) / Fine (yellow) mode
#   [79] = fine step +1  (blue when fine mode active)
#   [69] = fine step -1
# ─────────────────────────────────────────────────────────────────────────────
[[pages]]
name           = "XY"
selector_color = 79     # pink
xy_mode        = true

  [pages.xy_config]
  # These OSC addresses control a QLC+ Collection that sends to all 4 heads.
  # Map them to a virtual console XY pad that drives all heads at once,
  # OR use per-head addresses if you need individual control.
  pan_address    = "/qlc/channel/0/0"    # MH1 Pan (universe 0, DMX addr 0)
  tilt_address   = "/qlc/channel/0/2"    # MH1 Tilt
  color_inactive = 45   # blue
  color_active   = 72   # white


# ─────────────────────────────────────────────────────────────────────────────
# PAGE 5 [CC 96] — FADER (Dimmers)
# Columns 0-3 = Halogens (orange LEDs)   Columns 4-7 = RGBWs (cyan LEDs)
#
#  Col 0 = Halogen 1   Col 1 = Halogen 2   Col 2 = Halogen 3   Col 3 = Halogen 4
#  Col 4 = RGBW moni   Col 5 = RGBW main   Col 6 = RGBW komple Col 7 = MH dimmer
# ─────────────────────────────────────────────────────────────────────────────
[[pages]]
name           = "Fader"
selector_color = 96     # orange
fader_mode     = true

  [pages.fader_config]
  addresses = [
    "/qlc/channel/0/68",   # Halogen 1  (Generic dimmer ch0, DMX 69)
    "/qlc/channel/0/69",   # Halogen 2  (Generic dimmer ch1, DMX 70)
    "/qlc/channel/0/70",   # Halogen 3  (Generic dimmer ch2, DMX 71)
    "/qlc/channel/0/71",   # Halogen 4  (Generic dimmer ch3, DMX 72)
    "/qlc/channel/0/61",   # RGBW moni  (SePar ch0=Red as master, DMX 57)
    "/qlc/channel/0/65",   # RGBW main  (DMX 61)
    "/qlc/channel/0/69",   # RGBW komple(DMX 65) ← adjust if needed
    "/qlc/channel/0/61",   # MH dimmer  (MH1 ch5=dimmer, DMX 6)
  ]
  # Halogens: warm orange glow
  color_halogen_on  = 96   # orange
  color_halogen_off = 0
  # RGBWs: cyan
  color_rgb_on  = 57       # cyan
  color_rgb_off = 0
